name: CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore tests/AgenticDemo.Api.Tests/AgenticDemo.Api.Tests.csproj
      - run: dotnet build tests/AgenticDemo.Api.Tests/AgenticDemo.Api.Tests.csproj --no-restore
      - run: dotnet test tests/AgenticDemo.Api.Tests/AgenticDemo.Api.Tests.csproj --no-build
