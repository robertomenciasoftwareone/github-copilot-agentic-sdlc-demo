name: Dependabot training demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      # Deliberately old MAJOR versions for the Dependabot VERSION UPDATE demo.
      # They are here to make a version-update PR easy to demonstrate.
      - uses: actions/checkout@v3

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - run: dotnet --info
